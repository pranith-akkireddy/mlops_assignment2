apiVersion: apps/v1
kind: Deployment
metadata:
  name: digits-api
  labels:
    app: digits-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digits-api
  template:
    metadata:
      labels:
        app: digits-api
    spec:
      containers:
        - name: api
          image: digits-baseline-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/models/baseline_model.pkl
            - name: SCALER_PATH
              value: /app/data/processed/scaler.pkl
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
