name: CI - Test, Train & Build Image

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: cats-dogs-api
  REGISTRY: ghcr.io
  MAX_PER_CLASS: "1000"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # packages:write lets the automatic GITHUB_TOKEN push to GHCR, so no
    # registry secrets need to be configured on the repository.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Cats vs Dogs archive
        uses: actions/cache@v4
        with:
          path: data/raw/kagglecatsanddogs_5340.zip
          key: cats-dogs-archive-5340

      - name: Fetch and preprocess data
        run: python scripts/fetch_data.py --max-per-class ${{ env.MAX_PER_CLASS }}

      - name: Train baseline model
        run: python src/train.py --seed 42 --C 1.0 --max-iter 1000

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Upload model and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/cats_dogs_model.pkl
            data/processed/scaler.pkl
            artifacts/
          if-no-files-found: error

      - name: Show Podman version
        run: podman --version

      # --format docker is required: Podman defaults to the OCI format, which
      # silently discards the Dockerfile's HEALTHCHECK instruction.
      - name: Build container image
        run: podman build --format docker -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Verify image serves predictions
        run: |
          podman run -d --name ci-verify -p 8000:8000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          python scripts/smoke_test.py
          podman rm -f ci-verify

      # GITHUB_TOKEN is injected automatically; --password-stdin keeps it out
      # of the process list and the log.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: Push image to registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          # GHCR rejects uppercase in image paths, so normalise the owner.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=${{ env.REGISTRY }}/$OWNER/${{ env.IMAGE_NAME }}
          podman tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $REPO:${{ github.sha }}
          podman tag ${{ env.IMAGE_NAME }}:${{ github.sha }} $REPO:latest
          podman push $REPO:${{ github.sha }}
          podman push $REPO:latest
          echo "Pushed $REPO:${{ github.sha }} and :latest"
