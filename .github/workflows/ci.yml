name: CI - Test, Train & Build Image

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and preprocess data
        run: python scripts/fetch_data.py

      - name: Train baseline model
        run: python src/train.py --seed 42 --C 1.0 --max-iter 1000

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t digits-baseline-api:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to registry
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag digits-baseline-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/digits-baseline-api:${{ github.sha }}
          docker tag digits-baseline-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/digits-baseline-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/digits-baseline-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/digits-baseline-api:latest
