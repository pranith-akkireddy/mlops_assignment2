name: CI - Test, Train & Build Image

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: cats-dogs-api
  MAX_PER_CLASS: "1000"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Cats vs Dogs archive
        uses: actions/cache@v4
        with:
          path: data/raw/kagglecatsanddogs_5340.zip
          key: cats-dogs-archive-5340

      - name: Fetch and preprocess data
        run: python scripts/fetch_data.py --max-per-class ${{ env.MAX_PER_CLASS }}

      - name: Train baseline model
        run: python src/train.py --seed 42 --C 1.0 --max-iter 1000

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Upload model and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/cats_dogs_model.pkl
            data/processed/scaler.pkl
            artifacts/
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Verify image serves predictions
        run: |
          docker run -d --name ci-verify -p 8000:8000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          python scripts/smoke_test.py
          docker rm -f ci-verify

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
