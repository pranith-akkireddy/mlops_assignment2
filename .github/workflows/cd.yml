name: CD - Deploy & Smoke Test

on:
  workflow_run:
    workflows: ["CI - Test, Train & Build Image"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: cats-dogs-api

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test and deploy dependencies
        run: pip install pillow==10.4.0 podman-compose==1.6.0

      # --password-stdin keeps the token out of the process list and the log.
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" \
            | podman login docker.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull image from registry
        run: podman pull docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # --no-build guarantees the pulled registry image is deployed rather than
      # a locally rebuilt one.
      - name: Deploy via podman-compose
        env:
          IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        run: podman-compose -f docker-compose.yml up -d --no-build

      - name: Wait for service to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Service failed to become healthy in time."
          podman-compose logs
          exit 1

      - name: Run smoke tests
        run: python scripts/smoke_test.py

      - name: Show service logs
        if: always()
        run: podman-compose logs

      - name: Tear down service
        if: always()
        run: podman-compose -f docker-compose.yml down
