name: CD - Deploy & Smoke Test

on:
  workflow_run:
    workflows: ["CI - Test, Train & Build Image"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: cats-dogs-api
  REGISTRY: ghcr.io

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # packages:read lets the automatic GITHUB_TOKEN pull the image CI pushed,
    # even while the GHCR package is still private.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test and deploy dependencies
        run: pip install pillow==10.4.0 podman-compose==1.6.0

      # GITHUB_TOKEN is injected automatically; --password-stdin keeps it out
      # of the process list and the log.
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      # GHCR rejects uppercase in image paths, so normalise the owner.
      - name: Resolve image reference
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${{ env.REGISTRY }}/$OWNER/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Pull image from registry
        run: podman pull "$IMAGE"

      # --no-build guarantees the pulled registry image is deployed rather than
      # a locally rebuilt one. IMAGE is read from the environment above.
      - name: Deploy via podman-compose
        run: podman-compose -f docker-compose.yml up -d --no-build

      - name: Wait for service to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Service failed to become healthy in time."
          podman-compose logs
          exit 1

      - name: Run smoke tests
        run: python scripts/smoke_test.py

      - name: Show service logs
        if: always()
        run: podman-compose logs

      - name: Tear down service
        if: always()
        run: podman-compose -f docker-compose.yml down
